name: Build

on:
  push:
    branches: [ main, 'agent/**', 'release/**' ]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Build
        run: gradle build --stacktrace

      - name: Upload JARs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: CobblePasture-Optimizer-${{ github.sha }}
          path: build/libs/*.jar
